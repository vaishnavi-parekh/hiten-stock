<html lang="en">

    <meta charset="UTF-8">

    <title>Hiten Auto Mobile</title>
    <meta name="theme-color" content="#c2410c">
    <style>

        body { background: #fff5e6; padding: 15px; }
        .container { max-width: 500px; margin: 0 auto; }

        #authScreen { position: fixed; inset: 0; background: linear-gradient(160deg, #c2410c, #f59e0b); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 999; }
        .auth-card { background: white; border-radius: 24px; padding: 30px 25px; width: 100%; max-width: 380px; box-shadow: 0 20px 50px rgba(0,0,0,0.25); text-align: center; }
        .auth-input { width: 100%; padding: 14px; border: 2px solid #fcd34d; border-radius: 14px; font-size: 16px; margin-bottom: 12px; }
        .auth-btn { width: 100%; padding: 14px; border: none; border-radius: 14px; background: #c2410c; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
        .reset-link { display:block; margin-top:20px; color:#c2410c; font-size:13px; text-decoration:underline; cursor:pointer; font-weight:bold; }

        #appScreen { display: none; }
        .header { background: #c2410c; color: white; padding: 20px; border-radius: 20px; margin-bottom: 20px; text-align: center; position: relative; }
        .logout-btn { position: absolute; top: 14px; right: 14px; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.5); color: white; border-radius: 14px; padding: 6px 12px; font-size: 11px; cursor: pointer; }

        .stats { display: flex; gap: 10px; margin-bottom: 20px; }
        .stat-card { background: white; flex: 1; padding: 15px; border-radius: 15px; text-align: center; border: 2px solid #fcd34d; }
        .stat-number { font-size: 24px; font-weight: bold; color: #c2410c; }

        .bill-section { background: #16a34a; padding: 16px; border-radius: 20px; margin-bottom: 12px; color: white; text-align: center; }
        .bill-btn-row { display: flex; gap: 10px; margin-top: 10px; }
        .bill-btn { flex: 1; background: white; border: none; border-radius: 16px; padding: 12px; font-weight: bold; cursor: pointer; color: #166534; font-size: 15px; }
        .bill-btn:disabled { opacity: 0.5; }
        .src-row { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
        .src-btn { background: rgba(255,255,255,0.25); color: #fff; border: none; border-radius: 14px; padding: 6px 12px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .src-btn.active { background: #fff; color: #166534; }
        .bill-status { margin-top: 8px; font-size: 13px; font-weight: bold; color: #fff; min-height: 4px; }

        .sync-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; font-size: 12px; color: #555; }
        .sync-row span { flex: 1; }
        .sync-btn { background: white; border: 2px solid #fcd34d; border-radius: 14px; padding: 6px 10px; font-size: 12px; font-weight: bold; cursor: pointer; }

        .controls-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .search-box { flex: 1; padding: 12px 20px; border: 2px solid #fcd34d; border-radius: 25px; font-size: 16px; min-width: 0; }
        .add-product-btn { background: #c2410c; color: white; border: none; padding: 0 15px; border-radius: 25px; font-weight: bold; cursor: pointer; }

        .category-tabs { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; margin-bottom: 15px; }
        .category-tab { background: white; padding: 8px 15px; border-radius: 20px; border: 2px solid #fcd34d; cursor: pointer; white-space: nowrap; font-size: 13px; }
        .category-tab.active { background: #c2410c; color: white; border-color: #c2410c; }

        .company-group { background: white; border-radius: 20px; padding: 15px; border: 2px solid #fcd34d; margin-bottom: 15px; }
        .company-name { font-size: 18px; font-weight: bold; color: #c2410c; border-bottom: 2px solid #fde68a; margin-bottom: 10px; padding-bottom: 5px; }

        .product-card { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #fde68a; }
        .product-name { font-size: 25px; font-weight: 700; color: #222; margin-bottom: 4px; line-height: 1.25; }
        .product-type { font-size: 10px; color: #666; background: #eee; padding: 2px 8px; border-radius: 10px; }

        .stock-control { display: flex; align-items: center; gap: 6px; }
        .stock-number { font-size: 20px; font-weight: bold; min-width: 35px; text-align: center; }
        .stock-number.low { color: #dc2626; }
        .stock-number.normal { color: #16a34a; }
        .qty-input { width: 52px; padding: 6px 4px; border: 2px solid #fcd34d; border-radius: 10px; font-size: 16px; text-align: center; }
        .btn-icon { width: 32px; height: 32px; border-radius: 50%; border: none; font-size: 16px; font-weight: bold; cursor: pointer; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 1000; }
        .modal-overlay.open { display: flex; }
        .modal-box { background: white; border-radius: 20px; padding: 20px; width: 100%; max-width: 420px; max-height: 85vh; overflow-y: auto; }
        .modal-box input[type="text"], .modal-box input[type="password"], .modal-box input[type="url"] { width: 100%; padding: 12px; margin: 6px 0; border: 2px solid #fcd34d; border-radius: 12px; font-size: 16px; }
        .modal-box select { font-size: 16px; }
        .modal-box label.lbl { display: block; font-size: 12px; font-weight: bold; color: #555; margin-top: 10px; }
        .modal-btn { width: 100%; padding: 12px; border-radius: 12px; border: none; font-weight: bold; margin-top: 10px; cursor: pointer; }

        .bill-row { background: #fff5e6; padding: 12px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #fcd34d; }
        .bill-row.new { background: #eff6ff; border-color: #93c5fd; }
        .bill-row.check { background: #fefce8; border-color: #facc15; }
        .bill-row select { width: 100%; padding: 8px; margin: 6px 0; }
        .bill-row .mini { width: 100%; padding: 8px; margin: 3px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
        .badge { font-size: 10px; font-weight: bold; padding: 2px 8px; border-radius: 10px; margin-left: 6px; }
        .badge.ok { background: #dcfce7; color: #166534; }
        .badge.check { background: #fef9c3; color: #854d0e; }
        .badge.new { background: #dbeafe; color: #1e40af; }

        #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #222; color: #fff; padding: 12px 18px; border-radius: 14px; font-size: 14px; z-index: 2000; display: none; max-width: 90%; text-align: center; }

</head>
<body>

    <div id="authScreen">
        <div class="auth-card">
            <h2>💡 Hiten Auto</h2>
            <p style="font-size:13px; margin-bottom:15px; color:#666;">Enter password to manage stock</p>
            <input type="password" class="auth-input" id="authPasswordInput" placeholder="Password">
            <div id="firstRunFields" style="display:none;">
                <input type="password" class="auth-input" id="authPasswordConfirm" placeholder="Confirm Password">
            </div>
            <button class="auth-btn" onclick="handleAuthSubmit()">Unlock Shop</button>
            <div class="reset-link" onclick="resetAllData()">Reset App on this phone</div>
        </div>
    </div>

    <div id="appScreen">
        <div class="container">
            <div class="header">
                <button class="logout-btn" onclick="location.reload()">Log out</button>
                <h1>Hiten Auto Mobile</h1>
                <p style="font-size:12px; opacity:0.8;">Digital Stock Register</p>
            </div>

            <div class="stats">
                <div class="stat-card"><div class="stat-number" id="totalItems">0</div><div style="font-size:11px">Total</div></div>
                <div class="stat-card"><div class="stat-number" id="lowStockCount">0</div><div style="font-size:11px">Low</div></div>
                <div class="stat-card"><div class="stat-number" id="companyCount">0</div><div style="font-size:11px">Brands</div></div>
            </div>

            <div class="bill-section">
                <div style="font-weight:bold; font-size:16px;">📷 Scan Bill</div>
                <div class="bill-btn-row">
                    <button class="bill-btn" id="btnPurchase" onclick="triggerBillScan('add')">🛒 Purchase Bill<br><span style="font-size:11px; font-weight:normal;">adds stock</span></button>
                    <button class="bill-btn" id="btnSale" onclick="triggerBillScan('sub')">🧾 Sale Bill<br><span style="font-size:11px; font-weight:normal;">reduces stock</span></button>
                </div>
                <div class="src-row">
                    <button class="src-btn" id="srcCam" onclick="setSource('cam')">📷 Take photo</button>
                    <button class="src-btn" id="srcFile" onclick="setSource('file')">🖼 Gallery / PDF</button>
                </div>
                <div class="bill-status" id="billStatus"></div>
                <button class="bill-btn" id="btnCancelScan" style="display:none; flex:none; margin-top:8px; padding:8px 18px; font-size:13px;" onclick="cancelScan()">✖ Cancel</button>
                <input type="file" id="billCamInput" accept="image/*" capture="environment" style="display:none" onchange="handleBillFileSelected(event)">
                <input type="file" id="billFileInput" accept="image/*,application/pdf" multiple style="display:none" onchange="handleBillFileSelected(event)">
            </div>

            <div class="sync-row">
                <span id="syncStatus"></span>
                <button class="sync-btn" onclick="refreshFromSheet(true)">🔄 Refresh</button>
                <button class="sync-btn" onclick="openSetupModal()">⚙️ Setup</button>
            </div>

            <div class="controls-row">
                <input type="text" class="search-box" id="searchInput" placeholder="Search product...">
                <button class="add-product-btn" onclick="openAddProductModal()">➕ Item</button>
            </div>

            <div class="category-tabs" id="companyTabs"></div>
            <div id="productsGrid"></div>
        </div>
    </div>

    <!-- MODALS -->
    <div class="modal-overlay" id="setupModal">
        <div class="modal-box">
            <h3>⚙️ Setup</h3>
            <label class="lbl">Google Sheet web app URL (ends with /exec)</label>
            <input type="url" id="sheetUrlInput" placeholder="https://script.google.com/macros/s/.../exec">
            <label class="lbl">Gemini API key (for bill scanning)</label>
            <input type="password" id="geminiKeyInput" placeholder="Paste key here">
            <label class="lbl">Gemini model (leave as is unless scanning stops working)</label>
            <input type="text" id="geminiModelInput" placeholder="gemini-3.6-flash">
            <button class="modal-btn" style="background:#c2410c; color:#fff;" onclick="saveSetup()">Save & Connect</button>
            <button class="modal-btn" style="background:#fde68a;" onclick="seedSheet()">Upload this phone's list to an EMPTY sheet</button>
            <button class="modal-btn" onclick="closeSetupModal()">Cancel</button>
        </div>
    </div>

    <div class="modal-overlay" id="billReviewModal">
        <div class="modal-box">
            <h3 id="billReviewTitle">Confirm Scanned Items</h3>
            <p style="font-size:12px; margin-bottom:10px; color:#666;">Check matches before updating stock. Blue = new item (will be added to the sheet).</p>
            <div id="billReviewList"></div>
            <button class="modal-btn" style="background:#16a34a; color:#fff;" onclick="confirmBillReview()">Update Stock Now</button>
            <button class="modal-btn" onclick="closeBillReview()">Cancel</button>
        </div>
    </div>

    <div class="modal-overlay" id="addProductModal">
        <div class="modal-box">
            <h3>Add New Product</h3>
            <input type="text" id="newProdName" placeholder="Product Name">
            <input type="text" id="newProdCompany" placeholder="Brand Name">
            <select id="newProdType" style="width:100%; padding:10px; margin-bottom:10px;">
                <option value="Power Window Switch">Power Window Switch</option>
                <option value="Mirror Switch">Mirror Switch</option>
                <option value="Dicky Switch">Dicky Switch</option>
                <option value="Centre Lock">Centre Lock</option>
                <option value="Spiral">Spiral</option>
                <option value="Fuel Pump Motor">Fuel Pump Motor</option>
                <option value="Power Window Motor">Power Window Motor</option>
                <option value="Fan Motor">Fan Motor</option>
                <option value="IOC Value">IOC Value</option>
                <option value="Misc Switch">Misc Switch</option>
            </select>
            <button class="modal-btn" style="background:#c2410c; color:#fff;" onclick="addNewProduct()">Save</button>
            <button class="modal-btn" onclick="closeAddProductModal()">Cancel</button>
        </div>
    </div>

    <div id="toast"></div>

        async function fetchJson(url, opts, ms, holder) {
            const ctl = new AbortController();
            if (holder) holder.ctl = ctl;
            const timer = setTimeout(() => ctl.abort(), ms);
            try {
                const r = await fetch(url, { ...opts, signal: ctl.signal });
                const txt = await r.text();
                try { return JSON.parse(txt); }
                catch (e) { const err = new Error('NOT_JSON'); err.notJson = true; err.status = r.status; err.body = txt.slice(0, 200); throw err; }
            } catch (e) {
                if (e.name === 'AbortError') throw new Error('Timed out – no reply. Check internet.');
                throw e;
            } finally { clearTimeout(timer); }

            if (e instanceof TypeError) return 'Could not connect to the sheet link (check internet and that the URL is correct).';
            return e.message || 'Sheet error';

                return d;
            } catch (e) { throw new Error(sheetError(e)); }

        const STOP = new Set(['power','window','switch','sw','pcs','pc','nos','no','set','the','for','and','of','rs','qty']);
        function normTokens(str) {
            let s = ' ' + String(str || '').toLowerCase() + ' ';
            s = s.replace(/\bfr\s*[\/.]?\s*rh\b/g, ' frh ')
                 .replace(/\bf\s*[\/.]?\s*r\s*[\/.]?\s*h\b/g, ' frh ')

                 .replace(/\br\s*[\/.]\s*h\b/g, ' rh ')
                 .replace(/\bl\s*[\/.]\s*h\b/g, ' lh ')
                 .replace(/\bt\s*\.?\s*(\d)/g, ' t$1')
                 .replace(/(\d)\s*pin\b/g, '$1pin')
                 .replace(/(\d)\s*(?:door|dr)\b/g, '$1d')

        function detectType(name) {
            const n = String(name).toLowerCase();
            if (/spiral/.test(n)) return 'Spiral';
            if (/fuel/.test(n)) return 'Fuel Pump Motor';
            if (/(window|pw)\s*motor/.test(n)) return 'Power Window Motor';
            if (/\bfan\b/.test(n)) return 'Fan Motor';
            if (/dick?e?y|trunk|boot/.test(n)) return 'Dicky Switch';
            if (/(centre|center)\s*lock/.test(n)) return 'Centre Lock';
            if (/mirror/.test(n)) return 'Mirror Switch';

            if (!tokCache.has(item.product)) tokCache.set(item.product, normTokens(item.product));
            return tokCache.get(item.product);
        }
        function findMatches(name) {
            const A = normTokens(name);
            const hint = detectType(name);
            if (!A.length) return [];
            const scored = inventory.map(item => {
                const B = itemTokens(item);
                if (!B.length) return { item, score: 0 };
                let hits = 0;
                A.forEach(a => { let best = 0; B.forEach(b => { const h = tokHit(a, b); if (h > best) best = h; }); hits += best; });
                let score = 2 * hits / (A.length + B.length);
                if (hint) score += (item.type === hint) ? 0.12 : -0.1;
                return { item, score };
            });
            return scored.filter(x => x.score > 0.15).sort((a, b) => b.score - a.score).slice(0, 6);
        }
        function guessCompany(name) {
            const A = new Set(normTokens(name));
            const c = [...new Set(inventory.map(i => i.company))].find(co => normTokens(co).some(t => A.has(t)));
            return c || 'Other';
        }

        // ---------- bill scanning ----------
        let billSource = localStorage.getItem('billSource') || 'cam';
        function paintSource() {
            document.getElementById('srcCam').classList.toggle('active', billSource === 'cam');
            document.getElementById('srcFile').classList.toggle('active', billSource === 'file');
        }
        function setSource(s) { billSource = s; localStorage.setItem('billSource', s); paintSource(); }

        function triggerBillScan(type) {
            if (scanBusy) return;
            if (!localStorage.getItem('geminiKey')) { alert("First paste your Gemini key in ⚙️ Setup."); openSetupModal(); return; }
            pendingBillType = type;
            document.getElementById(billSource === 'cam' ? 'billCamInput' : 'billFileInput').click();
        }

        function setBillButtons(on) {
            document.getElementById('btnPurchase').disabled = !on;
            document.getElementById('btnSale').disabled = !on;
        }

        function fileToBase64(file) {
            return new Promise((res, rej) => {
                const r = new FileReader();
                r.onload = () => res(r.result.split(',')[1]);
                r.onerror = () => rej(new Error('Could not read file'));
                r.readAsDataURL(file);
            });
        }

        // shrink big phone photos so the upload is fast (PDFs are sent as they are)
        async function prepareFile(file) {
            if (file.type === 'application/pdf') return { mime: 'application/pdf', data: await fileToBase64(file) };
            try {
                const url = URL.createObjectURL(file);
                const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; });
                const max = 1800, sc = Math.min(1, max / Math.max(img.width, img.height));
                const cv = document.createElement('canvas');
                cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
                cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
                URL.revokeObjectURL(url);
                return { mime: 'image/jpeg', data: cv.toDataURL('image/jpeg', 0.85).split(',')[1] };
            } catch (e) {
                return { mime: file.type || 'image/jpeg', data: await fileToBase64(file) };
            }
        }

        const BILL_PROMPT = 'This is a photo or scan of a shop bill/invoice from an auto-parts shop. It may be dot-matrix, a carbon copy or handwritten. ' +
            'Extract ONLY the product line items: the item name/description exactly as written (keep model names, F/Rh, L/h, pin counts, T.3 etc.) and the quantity (a whole number; use 1 if no quantity is shown). ' +
            'Read handwriting carefully; if a word is unclear give your best guess. ' +
            'Ignore prices, amounts, totals, GST/tax, party names, addresses, dates and bill numbers. ' +
            'Return ONLY a JSON array like [{"name":"Swift F/Rh","qty":2}]. If there are no items return [].';

        function parseItems(txt) {
            let t = String(txt).replace(/```json|```/g, '').trim();
            const a = t.indexOf('['), b = t.lastIndexOf(']');
            if (a >= 0 && b > a) t = t.slice(a, b + 1);
            let arr = JSON.parse(t);
            if (arr && !Array.isArray(arr) && Array.isArray(arr.items)) arr = arr.items;
            if (!Array.isArray(arr)) throw new SyntaxError('Not a list');
            return arr.map(x => ({ name: String(x.name || x.item || '').trim(), qty: Math.max(1, parseInt(x.qty || x.quantity) || 1) })).filter(x => x.name);
        }

        let scanCtl = { ctl: null };
        let scanLabel = '';
        let scanBase = '', scanStart = 0, scanTimer = null;
        function paintStatus() {
            const s = (scanBase && scanStart) ? ' [' + Math.round((Date.now() - scanStart) / 1000) + 's]' : '';
            document.getElementById('billStatus').textContent = scanBase + s;
        }
        const setBillStatus = t => { scanBase = t; paintStatus(); };
        function stopScanTimer() { clearInterval(scanTimer); scanStart = 0; scanBase = ''; }

        async function askGemini(mime, data, token) {
            const key = localStorage.getItem('geminiKey');
            const chosen = (localStorage.getItem('geminiModel') || '').trim();
            const models = [chosen, ...MODEL_FALLBACKS].filter((m, i, a) => m && a.indexOf(m) === i);
            let lastErr = new Error('AI failed');
            const started = Date.now();
            for (const model of models) {
                for (let attempt = 0; attempt < 2; attempt++) {
                    if (token !== scanToken) throw new Error('cancelled');
                    if (Date.now() - started > 60000) throw new Error('Taking too long. Last problem: ' + lastErr.message);
                    setBillStatus(`${scanLabel} (${model}${attempt ? ', retry' : ''})` + (lastErr.message !== 'AI failed' ? ' – last problem: ' + lastErr.message.slice(0, 80) : ''));
                    try {
                        const j = await fetchJson(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ inline_data: { mime_type: mime, data } }, { text: BILL_PROMPT }] }],
                                generationConfig: { temperature: 0, responseMimeType: 'application/json' }
                            })
                        }, 30000, scanCtl);
                        if (j.error) {
                            const msg = j.error.message || 'AI error';
                            lastErr = new Error(model + ': ' + msg);
                            if (j.error.code === 404 || (j.error.code === 400 && /model/i.test(msg) && !/key/i.test(msg))) break;   // try next model
                            if (j.error.code === 429) break;                                                                          // limit reached on this model: go to the next one straight away
                            if (j.error.code === 503) { await sleep(2000); continue; }                                                 // busy: retry once
                            throw Object.assign(lastErr, { fatal: true });
                        }
                        const txt = ((j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || []).map(p => p.text || '').join('');
                        return parseItems(txt);
                    } catch (err) {
                        if (token !== scanToken) throw new Error('cancelled');
                        if (err.fatal) throw err;
                        lastErr = err.notJson ? new Error(model + ': AI sent an unreadable reply') : (err instanceof TypeError ? new Error('No internet / request blocked') : err);
                        await sleep(800);
                    }
                }
            }
            throw lastErr;
        }

        function cancelScan() {
            scanToken++;
            if (scanCtl.ctl) scanCtl.ctl.abort();
            scanBusy = false; setBillButtons(true); stopScanTimer(); setBillStatus('');
            document.getElementById('btnCancelScan').style.display = 'none';
        }

        async function handleBillFileSelected(e) {
            const files = [...e.target.files];
            e.target.value = '';
            if (!files.length) return;
            const type = pendingBillType;
            const myToken = ++scanToken;
            scanBusy = true; setBillButtons(false);
            scanStart = Date.now(); clearInterval(scanTimer); scanTimer = setInterval(paintStatus, 1000);
            document.getElementById('btnCancelScan').style.display = 'inline-block';
            let results = [], failed = false;
            try {
                for (let k = 0; k < files.length; k++) {
                    scanLabel = `AI is reading bill ${k + 1} of ${files.length}...`;
                    setBillStatus(scanLabel);
                    const f = await prepareFile(files[k]);
                    if (myToken !== scanToken) return;
                    const items = await askGemini(f.mime, f.data, myToken);
                    if (myToken !== scanToken) return;
                    results = results.concat(items);
                }
            } catch (err) {
                if (myToken !== scanToken) return;   // cancelled
                failed = true;
                alert('Could not read the bill:\n' + err.message);
            } finally {
                if (myToken === scanToken) {
                    scanBusy = false; setBillButtons(true); stopScanTimer(); setBillStatus('');
                    document.getElementById('btnCancelScan').style.display = 'none';
                }
            }
            if (myToken !== scanToken) return;
            if (results.length) openBillReview(type, results);
            else if (!failed) toast('No items found on that bill');
        }

        function openBillReview(type, results) {
            pendingBillType = type;
            pendingBillItems = results.map(r => {
                const m = findMatches(r.name);
                const best = m[0], second = m[1];
                let status = 'new', matchedId = 'new';
                if (best && best.score >= 0.4) {
                    matchedId = best.item.id;
                    status = (best.score >= 0.6 && !(second && best.score - second.score < 0.03 && best.score < 0.85)) ? 'ok' : 'check';
                }
                return { name: r.name, qty: r.qty, included: true, matchedId, status, cands: m,
                         newName: r.name, newCompany: guessCompany(r.name), newType: detectType(r.name) || 'Power Window Switch' };
            });
            renderBillReview();
            document.getElementById('billReviewTitle').textContent = type === 'add' ? '🛒 Purchase Bill – stock will go UP' : '🧾 Sale Bill – stock will go DOWN';
            document.getElementById('billReviewModal').classList.add('open');
        }

        function renderBillReview() {
            const allOpts = [...inventory].sort((a, b) => (a.company + a.product).localeCompare(b.company + b.product))
                .map(inv => `<option value="${inv.id}">${esc(inv.company)} - ${esc(inv.product)}</option>`).join('');
            let html = '';
            pendingBillItems.forEach((it, i) => {
                const badge = it.status === 'ok' ? '<span class="badge ok">✅ match</span>' : it.status === 'check' ? '<span class="badge check">⚠️ check</span>' : '<span class="badge new">🆕 new</span>';
                const top = it.cands.map(c => `<option value="${c.item.id}" ${c.item.id === it.matchedId ? 'selected' : ''}>${esc(c.item.company)} - ${esc(c.item.product)}</option>`).join('');
                html += `<div class="bill-row ${it.status === 'ok' ? '' : it.status}" id="brow-${i}">
                    <label><input type="checkbox" ${it.included ? 'checked' : ''} onchange="pendingBillItems[${i}].included=this.checked"> <b>${esc(it.name)}</b></label>${badge}
                    <select onchange="onMatchChange(${i}, this.value)">
                        <option value="new" ${it.matchedId === 'new' ? 'selected' : ''}>➕ Add as NEW item</option>
                        ${top ? `<optgroup label="Best matches">${top}</optgroup>` : ''}
                        <optgroup label="All items">${allOpts}</optgroup>
                    </select>
                    <div id="newf-${i}" style="display:${it.matchedId === 'new' ? 'block' : 'none'}">
                        <input class="mini" type="text" value="${esc(it.newName)}" placeholder="Item name" oninput="pendingBillItems[${i}].newName=this.value">
                        <input class="mini" type="text" value="${esc(it.newCompany)}" placeholder="Brand" oninput="pendingBillItems[${i}].newCompany=this.value">
                        <select class="mini" onchange="pendingBillItems[${i}].newType=this.value">${TYPES.map(t => `<option ${t === it.newType ? 'selected' : ''}>${t}</option>`).join('')}</select>
                    </div>
                    Qty: <input type="number" inputmode="numeric" value="${it.qty}" style="width:60px; padding:6px;" onchange="pendingBillItems[${i}].qty=parseInt(this.value)||1">
                </div>`;
            });
            document.getElementById('billReviewList').innerHTML = html;
        }

        function onMatchChange(i, v) {
            pendingBillItems[i].matchedId = v === 'new' ? 'new' : parseInt(v);
            document.getElementById('newf-' + i).style.display = v === 'new' ? 'block' : 'none';
        }

        function confirmBillReview() {
            const sign = pendingBillType === 'add' ? 1 : -1;
            const ops = [];
            let updated = 0, added = 0;
            pendingBillItems.forEach(row => {
                if (!row.included) return;
                const qty = Math.max(1, parseInt(row.qty) || 1);
                let item = null;
                if (row.matchedId === 'new') {
                    const name = (row.newName || row.name).trim();
                    const company = (row.newCompany || '').trim() || 'Other';
                    item = inventory.find(x => itemKey(x) === itemKey({ product: name, company }));
                    if (!item) {
                        const start = sign > 0 ? qty : 0;   // a new item on a sale bill starts at 0
                        const n = { id: Date.now() + added, product: name, company, type: row.newType, stock: start, lowThreshold: 2 };
                        inventory.unshift(n);
                        ops.push({ type: 'add', id: n.id, product: name, company, itemType: row.newType, stock: start, lowThreshold: 2 });
                        added++;
                        return;
                    }
                } else {
                    item = inventory.find(x => x.id === row.matchedId);
                }
                if (item) {
                    const op = applyDelta(item, sign * qty);
                    if (op) ops.push(op);
                    updated++;
                }
            });
            saveData(); updateDisplay(); closeBillReview();
            if (ops.length) queueOps(ops);
            toast(`Updated ${updated} item${updated === 1 ? '' : 's'}` + (added ? `, added ${added} new` : ''));
            pendingBillType = null; pendingBillItems = [];
        }

        // ---------- modals ----------
        function closeBillReview() { document.getElementById('billReviewModal').classList.remove('open'); }
        function openAddProductModal() { document.getElementById('addProductModal').classList.add('open'); }
        function closeAddProductModal() { document.getElementById('addProductModal').classList.remove('open'); }
        function addNewProduct() {
            const name = document.getElementById('newProdName').value.trim();
            const comp = document.getElementById('newProdCompany').value.trim();
            const type = document.getElementById('newProdType').value;
            if (!name || !comp) { alert("Fill details!"); return; }
            const n = { id: Date.now(), product: name, company: comp, type: type, stock: 0, lowThreshold: 2 };
            inventory.unshift(n);   // add at the TOP so it is easy to see
            saveData();
            document.getElementById('newProdName').value = '';
            document.getElementById('newProdCompany').value = '';
            document.getElementById('searchInput').value = '';
            selectedCompany = comp;
            closeAddProductModal();
            updateDisplay();
            window.scrollTo(0, 0);
            queueOps([{ type: 'add', id: n.id, product: name, company: comp, itemType: type, stock: 0, lowThreshold: 2 }]);
        }

        // ---------- keep several phones in step: quietly re-read the sheet ----------
        function busyUI() {
            if (scanBusy || flushing || pendingOps.length) return true;
            if (document.querySelector('.modal-overlay.open')) return true;
            const a = document.activeElement;
            if (a && a.tagName === 'INPUT') return true;
            return [...document.querySelectorAll('.qty-input')].some(i => i.value);
        }
        async function autoRefresh() {
            if (!sheetUrl() || document.hidden || document.getElementById('appScreen').style.display !== 'block' || busyUI()) return;
            try {
                const d = await sheetGet();
                if (d.items.length && !busyUI()) {
                    sheetEmpty = false;
                    applyRemote(d.items);
                    setSync('✅ Synced ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
                }
            } catch (e) { /* stay quiet, try again next time */ }
        }
        setInterval(autoRefresh, 30000);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) autoRefresh(); });

        window.onload = () => { if (!localStorage.getItem('shopPw')) document.getElementById('firstRunFields').style.display = 'block'; };
        document.getElementById('searchInput').oninput = renderGrid;
    </script>
</body>
