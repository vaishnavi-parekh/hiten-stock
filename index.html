<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Hiten Auto Mobile</title>
    <meta name="theme-color" content="#c2410c">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #fff5e6; padding: 15px; }
        .container { max-width: 500px; margin: 0 auto; }
        
        #authScreen { position: fixed; inset: 0; background: linear-gradient(160deg, #c2410c, #f59e0b); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 999; }
        .auth-card { background: white; border-radius: 24px; padding: 30px 25px; width: 100%; max-width: 380px; box-shadow: 0 20px 50px rgba(0,0,0,0.25); text-align: center; }
        .auth-input { width: 100%; padding: 14px; border: 2px solid #fcd34d; border-radius: 14px; font-size: 16px; margin-bottom: 12px; }
        .auth-btn { width: 100%; padding: 14px; border: none; border-radius: 14px; background: #c2410c; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
        .reset-link { display:block; margin-top:20px; color:#c2410c; font-size:13px; text-decoration:underline; cursor:pointer; font-weight:bold; }
 
        #appScreen { display: none; }
        .header { background: #c2410c; color: white; padding: 20px; border-radius: 20px; margin-bottom: 20px; text-align: center; position: relative; }
        .logout-btn { position: absolute; top: 14px; right: 14px; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.5); color: white; border-radius: 14px; padding: 6px 12px; font-size: 11px; cursor: pointer; }
        
        .stats { display: flex; gap: 10px; margin-bottom: 20px; }
        .stat-card { background: white; flex: 1; padding: 15px; border-radius: 15px; text-align: center; border: 2px solid #fcd34d; }
        .stat-number { font-size: 24px; font-weight: bold; color: #c2410c; }
 
        .bill-section { background: #16a34a; padding: 20px; border-radius: 20px; margin-bottom: 20px; color: white; text-align: center; }
        .bill-btn-row { display: flex; gap: 10px; margin-top: 10px; }
        .bill-btn { flex: 1; background: white; border: none; border-radius: 16px; padding: 12px; font-weight: bold; cursor: pointer; color: #166534; }
        .bill-status { margin-top: 10px; font-size: 13px; font-weight: bold; color: #fff; }
 
        .controls-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .search-box { flex: 1; padding: 12px 20px; border: 2px solid #fcd34d; border-radius: 25px; font-size: 16px; }
        .add-product-btn { background: #c2410c; color: white; border: none; padding: 0 15px; border-radius: 25px; font-weight: bold; cursor: pointer; }
 
        .category-tabs { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; margin-bottom: 15px; }
        .category-tab { background: white; padding: 8px 15px; border-radius: 20px; border: 2px solid #fcd34d; cursor: pointer; white-space: nowrap; font-size: 13px; }
        .category-tab.active { background: #c2410c; color: white; border-color: #c2410c; }
        
        .company-group { background: white; border-radius: 20px; padding: 15px; border: 2px solid #fcd34d; margin-bottom: 15px; }
        .company-name { font-size: 18px; font-weight: bold; color: #c2410c; border-bottom: 2px solid #fde68a; margin-bottom: 10px; padding-bottom: 5px; }
        
        .product-card { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #fde68a; }
        .product-name { font-size: 25px; font-weight: 700; color: #222; margin-bottom: 4px; line-height: 1.25; }
        .product-type { font-size: 10px; color: #666; background: #eee; padding: 2px 8px; border-radius: 10px; }
        
        .stock-control { display: flex; align-items: center; gap: 6px; }
        .stock-number { font-size: 20px; font-weight: bold; min-width: 35px; text-align: center; }
        .stock-number.low { color: #dc2626; }
        .stock-number.normal { color: #16a34a; }
        .qty-input { width: 52px; padding: 6px 4px; border: 2px solid #fcd34d; border-radius: 10px; font-size: 16px; text-align: center; }
        .btn-icon { width: 32px; height: 32px; border-radius: 50%; border: none; font-size: 16px; font-weight: bold; cursor: pointer; }
 
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 1000; }
        .modal-overlay.open { display: flex; }
        .modal-box { background: white; border-radius: 20px; padding: 20px; width: 100%; max-width: 420px; max-height: 80vh; overflow-y: auto; }
        .bill-row { background: #fff5e6; padding: 12px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #fcd34d; }
        .modal-box input[type="text"] { width: 100%; padding: 12px; margin: 8px 0; border: 2px solid #fcd34d; border-radius: 12px; font-size: 16px; }
        .modal-box select { font-size: 16px; }
        .modal-btn { width: 100%; padding: 12px; border-radius: 12px; border: none; font-weight: bold; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>
 
    <div id="authScreen">
        <div class="auth-card">
            <h2>💡 Hiten Auto</h2>
            <p style="font-size:13px; margin-bottom:15px; color:#666;">Enter password to manage stock</p>
            <input type="password" class="auth-input" id="authPasswordInput" placeholder="Password">
            <div id="firstRunFields" style="display:none;">
                <input type="password" class="auth-input" id="authPasswordConfirm" placeholder="Confirm Password">
            </div>
            <button class="auth-btn" onclick="handleAuthSubmit()">Unlock Shop</button>
            <div class="reset-link" onclick="resetAllData()">Reset App & Reload Items</div>
        </div>
    </div>
 
    <div id="appScreen">
        <div class="container">
            <div class="header">
                <button class="logout-btn" onclick="location.reload()">Log out</button>
                <h1>Hiten Auto Mobile</h1>
                <p style="font-size:12px; opacity:0.8;">Digital Stock Register</p>
            </div>
 
            <div class="stats">
                <div class="stat-card"><div class="stat-number" id="totalItems">0</div><div style="font-size:11px">Total</div></div>
                <div class="stat-card"><div class="stat-number" id="lowStockCount">0</div><div style="font-size:11px">Low</div></div>
                <div class="stat-card"><div class="stat-number" id="companyCount">0</div><div style="font-size:11px">Brands</div></div>
            </div>
 
            
 
            <div class="controls-row">
                <input type="text" class="search-box" id="searchInput" placeholder="Search product...">
                <button class="add-product-btn" onclick="openAddProductModal()">➕ Item</button>
            </div>
 
            <div class="category-tabs" id="companyTabs"></div>
            <div id="productsGrid"></div>
        </div>
    </div>
 
    <!-- MODALS -->
    <div class="modal-overlay" id="apiKeyModal">
        <div class="modal-box">
            <h3>AI Key Setup</h3>
            <input type="password" id="apiKeyInput" style="width:100%; padding:10px; margin:10px 0;" placeholder="Paste Key Here">
            <button class="modal-btn" style="background:#c2410c; color:#fff;" onclick="saveApiKey()">Save Key</button>
            <button class="modal-btn" onclick="closeApiKeyModal()">Cancel</button>
        </div>
    </div>
 
    <div class="modal-overlay" id="billReviewModal">
        <div class="modal-box">
            <h3>Confirm Scanned Items</h3>
            <p style="font-size:12px; margin-bottom:10px; color:#666;">Check matches before updating stock:</p>
            <div id="billReviewList"></div>
            <button class="modal-btn" style="background:#16a34a; color:#fff;" onclick="confirmBillReview()">Update Stock Now</button>
            <button class="modal-btn" onclick="closeBillReview()">Cancel</button>
        </div>
    </div>
 
    <div class="modal-overlay" id="addProductModal">
        <div class="modal-box">
            <h3>Add New Product</h3>
            <input type="text" id="newProdName" placeholder="Product Name">
            <input type="text" id="newProdCompany" placeholder="Brand Name">
            <select id="newProdType" style="width:100%; padding:10px; margin-bottom:10px;">
                <option value="Power Window Switch">Power Window Switch</option>
                <option value="Mirror Switch">Mirror Switch</option>
                <option value="Dicky Switch">Dicky Switch</option>
                <option value="Centre Lock">Centre Lock</option>
                <option value="Spiral">Spiral</option>
                <option value="Fuel Pump Motor">Fuel Pump Motor</option>
                <option value="Power Window Motor">Power Window Motor</option>
                <option value="Fan Motor">Fan Motor</option>
                <option value="IOC Value">IOC Value</option>
                <option value="Misc Switch">Misc Switch</option>
            </select>
            <button class="modal-btn" style="background:#c2410c; color:#fff;" onclick="addNewProduct()">Save</button>
            <button class="modal-btn" onclick="closeAddProductModal()">Cancel</button>
        </div>
    </div>

        let inventory = [];
        let selectedCompany = 'All';
        let pendingBillType = null;
        let pendingBillItems = [];
 
        function handleAuthSubmit() {
            const pw = document.getElementById('authPasswordInput').value;
            const saved = localStorage.getItem('shopPw');
            if (!saved) {
                const conf = document.getElementById('authPasswordConfirm').value;
                if (pw && pw === conf) { localStorage.setItem('shopPw', pw); showApp(); }
                else { alert("Set a password first!"); }
            } else if (pw === saved) { showApp(); }
            else { alert("Wrong password!"); }
        }
 
        function showApp() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('appScreen').style.display = 'block';
            loadData();
            updateDisplay();
        }
 
        function loadData() {
            // If the saved list is from an older stock version, replace it with the new list
            if (localStorage.getItem('stockVersion') !== STOCK_VERSION) {
                localStorage.removeItem('inventory');
                localStorage.setItem('stockVersion', STOCK_VERSION);
            }
            const saved = localStorage.getItem('inventory');
            inventory = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(INITIAL_STOCK));
        }
 
        function saveData() { localStorage.setItem('inventory', JSON.stringify(inventory)); }
        function resetAllData() { if(confirm("This will load the full product list. Continue?")) { localStorage.clear(); location.reload(); }}
 
        function updateDisplay() {
            document.getElementById('totalItems').textContent = inventory.reduce((s, i) => s + i.stock, 0);
            document.getElementById('lowStockCount').textContent = inventory.filter(i => i.stock < i.lowThreshold).length;
            document.getElementById('companyCount').textContent = [...new Set(inventory.map(i => i.company))].length;
            renderGrid();
        }
 
        function renderGrid() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filtered = inventory.filter(i => (selectedCompany === 'All' || i.company === selectedCompany) && (i.product.toLowerCase().includes(search) || i.company.toLowerCase().includes(search) || i.type.toLowerCase().includes(search)));
            const tabs = ['All', ...new Set(inventory.map(i => i.company))];
            document.getElementById('companyTabs').innerHTML = tabs.map(t => `<div class="category-tab ${t === selectedCompany ? 'active' : ''}" onclick="selectedCompany='${t}'; renderGrid()">${t}</div>`).join('');
 
            const groups = {};
            filtered.forEach(i => { if (!groups[i.company]) groups[i.company] = []; groups[i.company].push(i); });
            let html = '';
            for (let comp in groups) {
                html += `<div class="company-group"><div class="company-name">${comp}</div>`;
                groups[comp].forEach(item => {
                    html += `<div class="product-card">
                        <div><div class="product-name">${item.product}</div><span class="product-type">${item.type}</span></div>
                        <div class="stock-control">
                            <span class="stock-number ${item.stock < item.lowThreshold ? 'low' : 'normal'}">${item.stock}</span>
                            <input type="number" inputmode="numeric" min="1" class="qty-input" id="qty-${item.id}" placeholder="1">
                            <button class="btn-icon" style="background:#dcfce7" onclick="adj(${item.id}, 1)">+</button>
                            <button class="btn-icon" style="background:#fee2e2" onclick="adj(${item.id}, -1)">-</button>
                        </div>
                    </div>`;
                });
                html += `</div>`;
            }
            document.getElementById('productsGrid').innerHTML = html || '<p style="text-align:center; padding:20px;">No items.</p>';
        }
 
        function adj(id, sign) {
            const i = inventory.find(x => x.id === id);
            if (!i) return;
            const box = document.getElementById('qty-' + id);
            const n = Math.abs(parseInt(box && box.value)) || 1;   // empty = 1
            i.stock = Math.max(0, i.stock + sign * n);
            saveData(); updateDisplay();
        }
 
        // --- AI SCANNING ---
        function triggerBillScan(type) { 
            if (!localStorage.getItem('geminiKey')) return alert("Please click 'Edit AI Key' first and paste your Google key!");
            pendingBillType = type; 
            document.getElementById('billFileInput').click(); 
        }
 
        async function handleBillFileSelected(e) {
            const files = e.target.files;
            if (!files.length) return;
            const status = document.getElementById('billStatus');
            let results = [];
            
            for (let file of files) {
                status.textContent = "AI is reading: " + file.name + "...";
                try {
                    const reader = new FileReader();
                    const base64Promise = new Promise(r => { reader.onload = () => r(reader.result.split(',')[1]); reader.readAsDataURL(file); });
                    const base64 = await base64Promise;
                    
                    const key = localStorage.getItem('geminiKey');
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-lite:generateContent?key=${key}`;
                    
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ inline_data: { mime_type: file.type || 'image/jpeg', data: base64 } }, { text: "List items from this bill as a JSON array ONLY: [{\"name\":\"ItemName\",\"qty\":1}]. Do not explain." }] }] })
                    });
                    
                    const data = await res.json();
                    if (data.error) throw new Error(data.error.message);
                    
                    const text = data.candidates[0].content.parts[0].text.replace(/```json|```/g, '').trim();
                    results = results.concat(JSON.parse(text));
                } catch (err) { alert("Error reading " + file.name + ": " + err.message); }
            }
            
            if (results.length) {
                pendingBillItems = results.map(r => ({ ...r, matchedId: autoMatch(r.name), included: true }));
                openBillReview();
            }
            status.textContent = "";
        }
 
        function autoMatch(name) {
            const n = name.toLowerCase();
            const match = inventory.find(i => n.includes(i.product.toLowerCase().split(' ')[0]) || i.product.toLowerCase().includes(n.split(' ')[0]));
            return match ? match.id : null;
        }
 
        function openBillReview() {
            let html = '';
            pendingBillItems.forEach((item, i) => {
                html += `<div class="bill-row">
                    <input type="checkbox" checked onchange="pendingBillItems[${i}].included=this.checked"> <b>${item.name}</b>
                    <select style="width:100%; margin:5px 0;" onchange="pendingBillItems[${i}].matchedId=parseInt(this.value)">
                        <option value="">-- Manual Select --</option>
                        ${inventory.map(inv => `<option value="${inv.id}" ${inv.id === item.matchedId ? 'selected' : ''}>${inv.company} - ${inv.product}</option>`).join('')}
                    </select>
                    Qty: <input type="number" value="${item.qty}" style="width:50px" onchange="pendingBillItems[${i}].qty=parseInt(this.value)">
                </div>`;
            });
            document.getElementById('billReviewList').innerHTML = html;
            document.getElementById('billReviewModal').classList.add('open');
        }
 
        function confirmBillReview() {
            pendingBillItems.forEach(row => {
                if (row.included && row.matchedId) {
                    const item = inventory.find(i => i.id === row.matchedId);
                    const change = pendingBillType === 'add' ? row.qty : -row.qty;
                    item.stock = Math.max(0, item.stock + change);
                }
            });
            saveData(); updateDisplay(); closeBillReview();
            alert("Stock Updated Successfully!");
        }
 
        // MODAL UTILS
        function openApiKeyModal() { document.getElementById('apiKeyModal').classList.add('open'); document.getElementById('apiKeyInput').value = localStorage.getItem('geminiKey') || ''; }
        function closeApiKeyModal() { document.getElementById('apiKeyModal').classList.remove('open'); }
        function saveApiKey() { localStorage.setItem('geminiKey', document.getElementById('apiKeyInput').value); closeApiKeyModal(); alert("Key Saved!"); }
        function closeBillReview() { document.getElementById('billReviewModal').classList.remove('open'); }
        function openAddProductModal() { document.getElementById('addProductModal').classList.add('open'); }
        function closeAddProductModal() { document.getElementById('addProductModal').classList.remove('open'); }
        function addNewProduct() {
            const name = document.getElementById('newProdName').value.trim();
            const comp = document.getElementById('newProdCompany').value.trim();
            const type = document.getElementById('newProdType').value;
            if (!name || !comp) { alert("Fill details!"); return; }
            // add at the TOP so it is easy to see
            inventory.unshift({ id: Date.now(), product: name, company: comp, type: type, stock: 0, lowThreshold: 2 });
            saveData();
            document.getElementById('newProdName').value = '';
            document.getElementById('newProdCompany').value = '';
            document.getElementById('searchInput').value = '';
            selectedCompany = comp;   // jump to the brand tab of the new item
            closeAddProductModal();
            updateDisplay();
            window.scrollTo(0, 0);
        }
 
        window.onload = () => { if (!localStorage.getItem('shopPw')) document.getElementById('firstRunFields').style.display = 'block'; };
        document.getElementById('searchInput').oninput = renderGrid;
    </script>
